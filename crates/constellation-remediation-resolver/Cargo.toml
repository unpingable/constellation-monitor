[package]
name = "constellation-remediation-resolver"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
description = "AG typed-v3 observation resolver over NQ ops-store systemd unit evaluations, for bounded autonomous remediation."

[[bin]]
name = "constellation-nq-unit-resolver"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["parsing"] }

[dev-dependencies]
tempfile = "3.23"
time = { workspace = true, features = ["formatting", "parsing"] }

[lints]
workspace = true

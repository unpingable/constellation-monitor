[package]
name = "constellation-remediation-consumer"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
description = "Deterministic one-shot consumer that drives one governed AG/Docket start of the enrolled unit per attention condition episode."

[features]
# Qualification artifacts only; ordinary production builds accept HTTPS alone.
qualification-loopback = []

[[bin]]
name = "constellation-remediation-consumer"
path = "src/main.rs"

[dependencies]
constellation-remediation-resolver = { path = "../constellation-remediation-resolver" }
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
toml.workspace = true
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true

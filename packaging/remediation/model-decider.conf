# Drop-in enabling the model decider (bounded autonomous remediation v2).
# Install as
#   /etc/systemd/system/constellation-remediation-consumer.service.d/model-decider.conf
# only after the owner has enrolled the LA admission, installed the
# [model] section and /etc/constellation-remediation/openrouter.env (root 0600),
# and accepted the external-disclosure decision (cartography
# architecture/agentic-remediation-v2/DESIGN.md section 5). Remove it to return
# to the deterministic decider; nothing else changes.
[Service]
ExecStart=
ExecStart=/usr/bin/constellation-remediation-consumer --config /etc/constellation-remediation/consumer.toml --decider model
# HTTPS and DNS egress for the provider adapter. The restriction is unit-wide:
# AG, Docket, ag-effectd, nq and systemctl children could open IP sockets too,
# but they run with a cleared environment (no key, no proxy, no D-Bus address)
# and fixed argv. AF_UNIX stays for the systemd bus.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# la_inference runs as the consumer's child, in this sandbox, as root.
ReadWritePaths=/var/lib/linear-accountant
